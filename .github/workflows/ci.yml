name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (all shell sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell sources
        run: shellcheck --shell=bash clean_mac.sh lib/core/*.sh lib/categories/*.sh

  python-tests:
    name: Python unit tests
    # clean_mac.sh uses BSD-only tooling (stat -f, sw_vers), and the tests
    # shell out to it, so they must run on macOS — not ubuntu.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.10"
          - os: macos-15
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m py_compile web/server.py

  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run node:test specs
        run: node --test tests/*.mjs

      - name: Parse browser JavaScript
        run: node --check web/script.js && node --check web/scanutil.js
